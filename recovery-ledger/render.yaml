services:
  - type: web
    name: recovery-ledger
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POLAR_CLIENT_ID
        sync: false          # set manually in Render dashboard
      - key: POLAR_CLIENT_SECRET
        sync: false          # set manually in Render dashboard
      - key: POLAR_REDIRECT_URI
        sync: false          # set manually in Render dashboard
      - key: DB_PATH
        value: /var/data/recovery_ledger.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
