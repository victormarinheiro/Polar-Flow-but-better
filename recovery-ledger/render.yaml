services:
  - type: web
    name: recovery-ledger
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POLAR_CLIENT_ID
        sync: false
      - key: POLAR_CLIENT_SECRET
        sync: false
      - key: POLAR_REDIRECT_URI
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ENABLE_DEBUG_RAW
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: recovery-ledger-db
          property: connectionString

databases:
  - name: recovery-ledger-db
    plan: free
